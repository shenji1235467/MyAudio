<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB" id="metaThemeColor">
<title>MyAudio · 登录</title>
<script>
  // 与主页保持同一套主题偏好，默认明亮，避免登录前后明暗跳变
  (function () {
    var theme = localStorage.getItem('myaudio_theme');
    if (theme !== 'dark' && theme !== 'light') theme = 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
<div class="ambient"></div>

<main class="login-wrap">
  <div class="glass login-card">
    <div class="logo-center"><span class="logo">MyAudio</span></div>
    <p class="login-sub">私人在线音频播放服务</p>

    <label class="field-label" for="password">访问密码</label>
    <div class="search-wrap" style="max-width:none;margin-bottom:16px">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input id="password" class="search-input" type="password" placeholder="请输入访问密码" autocomplete="current-password">
    </div>

    <label class="remember">
      <input id="remember" type="checkbox" checked>
      七天内免登录
    </label>

    <button id="loginBtn" class="btn-primary">进入音频库</button>

    <div id="errorHint" class="error-hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-7h-2v5h2V9z"/></svg>
      <span id="errorText">密码错误，请重试</span>
    </div>

    <p class="login-foot">登录状态通过会话 Cookie 保持<br>连续失败 5 次将锁定 10 分钟</p>
  </div>
</main>

<script>
const btn = document.getElementById('loginBtn');
const input = document.getElementById('password');
const hint = document.getElementById('errorHint');
const errText = document.getElementById('errorText');

async function doLogin() {
  const password = input.value;
  if (!password) { showError('请输入密码'); return; }
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    if (resp.ok) {
      location.href = '/';
      return;
    }
    const data = await resp.json().catch(() => ({}));
    showError(data.error || ('登录失败（HTTP ' + resp.status + '）'));
  } catch (e) {
    showError('网络错误，请检查服务是否可用');
  } finally {
    btn.disabled = false;
    btn.textContent = '进入音频库';
  }
}

function showError(msg) {
  errText.textContent = msg;
  hint.classList.add('show');
}

btn.addEventListener('click', doLogin);
input.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
input.focus();
</script>
</body>
</html>
